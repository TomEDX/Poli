name: Seed

# Fills poli-develop with the fictional dataset of scripts/seed-local.ts (ADR 0006).
# Each section is written only when its table is empty, so a rerun keeps what
# editors have entered. Production is never seeded.
on:
  workflow_dispatch:

concurrency: seed-develop

jobs:
  seed:
    if: github.ref_name == 'develop'
    runs-on: ubuntu-latest
    environment: develop
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEED_TARGET: develop
