name: Migrate

# Applies the Drizzle migrations to the database of the environment that matches
# the pushed branch (ADR 0006). The URL is the Supabase session pooler: GitHub
# runners only speak IPv4, which the direct connection does not offer.
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency: migrate-${{ github.ref_name }}

jobs:
  migrate:
    if: contains(fromJSON('["develop", "main"]'), github.ref_name)
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
