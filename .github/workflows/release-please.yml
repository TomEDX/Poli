name: Release

# Release-please runs on develop so that the release commit is part of the
# version promoted to main by fast-forward (ADR 0006).
on:
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    environment: release
    steps:
      # A personal token, because pull requests opened with GITHUB_TOKEN do not
      # trigger CI and could never pass the required checks.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: develop
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
